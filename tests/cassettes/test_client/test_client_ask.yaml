            type: object
        type: function
      - function:
          description: Execute Python against the sandboxed document filesystem.
          name: execute_code
          parameters:
            additionalProperties: false
            properties:
              code:
                type: string
            required:
            - code
            type: object
        type: function
      - function:
          description: Register exact retrieved chunk IDs as citations for the answer.
          name: cite
          parameters:
            additionalProperties: false
            properties:
              chunk_ids:
                items:
                  type: string
                type: array
            required:
            - chunk_ids
            type: object
        type: function
