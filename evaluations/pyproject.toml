[project]

name = "haiku.rag-evals"
description = "Benchmarking and evaluation scripts for haiku.rag"
version = "0.89.0"
authors = [{ name = "Yiorgis Gozadinos", email = "ggozadinos@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "haiku.rag-slim",
    "pydantic-ai-slim[evals,logfire]>=1.81.0",
    "beautifulsoup4>=4.12.0",
    "datasets>=4.6.1",
    "huggingface_hub>=0.20.0",
    "typer>=0.21.0,<0.22.0",
    "python-dotenv>=1.2.2",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
evaluations = "evaluations.benchmark:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["evaluations"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["haiku", "evaluations"]
