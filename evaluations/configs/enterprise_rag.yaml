# Reference config for the `enterprise_rag` evaluation database.
# EnterpriseRAG-Bench (onyx-dot-app/EnterpriseRAG-Bench): 500 questions over
# 511,962 synthetic internal documents of one company (slack, gmail, linear,
# google_drive, hubspot, fireflies, github, jira, confluence), with
# near-duplicates whose facts conflict.
# Run: evaluations run enterprise_rag --config configs/enterprise_rag.yaml
# base_url uses the `vllm` host serving each model over an OpenAI-compatible API.
# The corpus is text-only: no multimodal embedder, no vision paths.

environment: development

storage:
  auto_vacuum: false

embeddings:
  model:
    provider: openai
    name: qwen3-embedding-4b
    vector_dim: 2560
    base_url: http://vllm:11431/v1

reranking:
  model:
    provider: vllm
    name: Qwen/Qwen3-Reranker-4B
    base_url: http://vllm:11455

qa:
  model:
    provider: openai
    name: Inferact/Qwen3.8-27B-NVFP4
    base_url: http://vllm:11439/v1
    max_tokens: 16384
    temperature: 0.6
    extra_body:
      chat_template_kwargs:
        # qwen3.8 defaults to xhigh, which spends the output budget
        # deliberating and truncates the answer. low | medium | xhigh.
        reasoning_effort: low

evaluations:
  judge:
    provider: openai
    name: Inferact/Qwen3.8-27B-NVFP4
    base_url: http://vllm:11439/v1
    temperature: 0.6
    max_tokens: 16384
    extra_body:
      top_p: 0.95
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        reasoning_effort: low
