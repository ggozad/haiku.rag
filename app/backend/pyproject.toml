[project]
name = "haiku-rag-app"
version = "0.1.0"
description = "Conversational RAG application with haiku.rag"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.50.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic-ai-slim[ag-ui,anthropic,openai]>=2.40.0,<3.0.0",
    "python-dotenv>=1.2.1",
    "haiku.rag-slim>=0.98.0",
    "logfire[pydantic-ai]>=3.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haiku_rag_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore:invalid escape sequence:SyntaxWarning",
]

[tool.coverage.run]
source = ["haiku_rag_app"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["haiku", "haiku_rag_app"]
