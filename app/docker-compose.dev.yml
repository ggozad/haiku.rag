# Local development with hot reloading
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  backend:
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
    # The mounted package shadows the installed one: uvicorn puts its working
    # directory first on the import path.
    command: ["uvicorn", "--factory", "haiku_rag_app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--reload"]
    working_dir: /app/src
    # No authentication; bound to loopback. The frontend reaches it over the compose network.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - HAIKU_RAG_CONFIG_PATH=/app/haiku.rag.yaml
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - HAIKU_RAG_APP_SESSIONS=/sessions/sessions.db
      - INGESTER_TOKEN=${INGESTER_TOKEN:-}
    volumes:
      # haiku.rag.yaml places the database at /data.
      - ${DB_VOLUME:-./data/haiku.rag.lancedb}:/data
      - sessions:/sessions
      - ./backend/haiku_rag_app:/app/src/haiku_rag_app:ro
      - ./haiku.rag.yaml:/app/haiku.rag.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The one writer of the databases. It ingests the documents mounted from
  # DOCS_VOLUME at /docs, and writes each database listed under
  # ingester.databases.
  ingester:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["haiku-ingester", "--config", "/app/haiku.rag.yaml", "serve", "--host", "0.0.0.0"]
    # No authentication beyond the token; bound to loopback like the backend.
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - INGESTER_TOKEN=${INGESTER_TOKEN:-}
    volumes:
      - ${DB_VOLUME:-./data/haiku.rag.lancedb}:/data
      - ${DOCS_VOLUME:-./docs}:/docs:ro
      - ingester_queue:/queue
      - ./haiku.rag.yaml:/app/haiku.rag.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The ingester drains its workers for up to 60 s on SIGTERM.
    stop_grace_period: 180s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: base
    command: sh -c "pnpm install && pnpm dev"
    working_dir: /app
    # No authentication; it proxies every backend route, so it stays on loopback too.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - INGESTER_URL=http://ingester:8765
      - INGESTER_TOKEN=${INGESTER_TOKEN:-}
      - HOSTNAME=0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  sessions:
  ingester_queue:
  frontend_node_modules:
